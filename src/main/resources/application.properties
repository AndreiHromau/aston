spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/users_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

app.kafka.user-events-topic=${USER_EVENTS_TOPIC:user-events}
app.kafka.producer.acks=${KAFKA_PRODUCER_ACKS:1}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

spring.application.name=${SPRING_APPLICATION_NAME:user-service}

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}

resilience4j.circuitbreaker.instances.notificationService.slidingWindowType=${CB_NOTIFICATION_WINDOW_TYPE:COUNT_BASED}
resilience4j.circuitbreaker.instances.notificationService.slidingWindowSize=${CB_NOTIFICATION_WINDOW_SIZE:10}
resilience4j.circuitbreaker.instances.notificationService.failureRateThreshold=${CB_NOTIFICATION_FAILURE_RATE_THRESHOLD:50}
resilience4j.circuitbreaker.instances.notificationService.waitDurationInOpenState=${CB_NOTIFICATION_WAIT_DURATION_IN_OPEN_STATE:10s}
resilience4j.circuitbreaker.instances.notificationService.permittedNumberOfCallsInHalfOpenState=${CB_NOTIFICATION_PERMITTED_CALLS_IN_HALF_OPEN:3}