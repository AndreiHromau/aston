spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/users_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

app.kafka.user-events-topic=${USER_EVENTS_TOPIC:user-events}
app.kafka.producer.acks=${KAFKA_PRODUCER_ACKS:1}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

spring.application.name=${SPRING_APPLICATION_NAME:user-service}

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}